name: Publish complete BlackServ Gallery source

on:
  push:
    branches:
      - feature/blackserv-gallery-day-selection
    paths:
      - .github/workflows/publish-blackserv-source.yml

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble full source from pinned upstream and reviewed patch
        run: |
          git clone --no-checkout --depth 1 https://github.com/Bn5prS/Photon_Gallery.git source
          git -C source fetch --depth 1 origin 382c7a28fbda1907d76d12a43f604ed6d50b181e
          git -C source checkout --detach FETCH_HEAD
          git -C source apply --check ../patches/blackserv-gallery-day-selection.patch
          git -C source apply ../patches/blackserv-gallery-day-selection.patch
          git -C source add -A
          git -C source config user.name "github-actions[bot]"
          git -C source config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C source write-tree > "$RUNNER_TEMP/blackserv-tree-sha"
          git -C source commit-tree "$(cat "$RUNNER_TEMP/blackserv-tree-sha")" -m "BlackServ Gallery: full source for day selection" > "$RUNNER_TEMP/blackserv-commit-sha"
      - name: Publish one independent source snapshot branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C source remote add blackserv "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C source push blackserv "$(cat "$RUNNER_TEMP/blackserv-commit-sha"):refs/heads/source/blackserv-gallery"
