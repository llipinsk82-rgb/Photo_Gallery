name: BlackServ CI

on:
  push:
    branches:
      - 'source/blackserv-gallery'
      - 'feature/blackserv-cloud-picker-signing'
  pull_request:
    branches:
      - 'source/blackserv-gallery'

permissions:
  contents: read

jobs:
  test-and-debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Face SQL privacy and grouping regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_face_*.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 37 SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Unit tests and debug compile
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain

  signed-test-apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/blackserv-cloud-picker-signing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 37 SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Configure permanent BlackServ signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > blackserv-gallery.jks
          {
            echo "storeFile=blackserv-gallery.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
      - name: Build permanently signed test APK
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Upload signed APKs for device test
        uses: actions/upload-artifact@v4
        with:
          name: BlackServGallery-signed-test
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
