name: BlackServ CI

on:
  push:
    branches:
      - 'source/blackserv-gallery'
      - 'feature/blackserv-cloud-picker-signing'
  pull_request:
    branches:
      - 'source/blackserv-gallery'

permissions:
  contents: read

jobs:
  test-and-debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 37 SDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Unit tests and debug compile
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain
