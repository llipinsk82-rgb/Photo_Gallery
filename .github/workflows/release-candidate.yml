name: BlackServ Release Candidate

on:
  push:
    branches:
      - 'feature/blackserv-cloud-picker-signing'
    paths:
      - '.github/workflows/release-candidate.yml'

permissions:
  contents: read

jobs:
  signed-release-candidate:
    name: Build signed release candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 37 SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Configure permanent BlackServ signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing one or more permanent BlackServ signing secrets." >&2
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > blackserv-gallery.jks
          echo "storeFile=blackserv-gallery.jks" > key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> key.properties
          echo "keyAlias=$KEY_ALIAS" >> key.properties
          echo "keyPassword=$KEY_PASSWORD" >> key.properties

      - name: Build signed release APKs
        run: ./gradlew assembleRelease --console=plain

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "Verifying $apk"
            $ANDROID_HOME/build-tools/37.0.0/apksigner verify --verbose --print-certs "$apk"
          done

      - name: Upload signed release candidate
        uses: actions/upload-artifact@v4
        with:
          name: BlackServGallery-signed-release-candidate
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
